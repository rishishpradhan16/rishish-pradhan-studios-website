    <script>
      // Robust fix for "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          
          // Try to redefine the property with both getter and setter
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(value) {
              // Allow setting but don't throw if it fails
              currentFetch = value;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // If redefinition fails (e.g. not configurable), 
          // we at least tried. Some environments are very restrictive.
          console.warn('Fetch polyfill protection could not be fully applied:', e);
        }
      })();
    </script>
